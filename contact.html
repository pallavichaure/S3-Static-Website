<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - TravelGo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #fafafa;
}

/* NAVBAR */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 50px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    color: white;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

nav a {
    margin: 0 15px;
    text-decoration: none;
    color: white;
}

nav a:hover {
    color: #ffcc70;
}

.nav-buttons button {
    margin-left: 10px;
    padding: 8px 18px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
}

.login-btn {
    background: white;
    color: #333;
}

.book-btn {
    background: linear-gradient(to right, #ff7e5f, #ff416c);
    color: white;
}

/* HERO */
.hero {
    height: 35vh;
    background: url('1.jpg') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 38px;
    font-weight: 600;
}

/* CONTACT SECTION */
.contact {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 60px 30px;
    flex-wrap: wrap;
}

/* FORM */
.contact-form {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 350px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.contact-form h2 {
    margin-bottom: 20px;
}

.contact-form input,
.contact-form textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.contact-form button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(to right, #ff7e5f, #ff416c);
    color: white;
    cursor: pointer;
}

/* INFO */
.contact-info {
    max-width: 300px;
}

.contact-info h2 {
    margin-bottom: 15px;
}

.contact-info p {
    margin: 10px 0;
    color: #555;
}

/* FOOTER */
.footer {
    background: #111;
    color: white;
    padding: 25px;
    text-align: center;
}

/* RESPONSIVE */
@media(max-width:768px){
    .hero {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="logo">🌍 TravelGo</div>
    <nav>
        <a href="home.html">Home</a>
        <a href="destination.html">Destinations</a>
        <a href="packages.html">Packages</a>
       
        <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-buttons">
        <a href="admin.php"><button class="login-btn">Login</button></a>
        <a href="book.html">
    <button>Book Now</button>
</a>
    </div></header>
<!-- HERO -->
<section class="hero">
    Contact Us 📞
</section>

<!-- CONTACT -->
<section class="contact">

    <!-- FORM -->
    <div class="contact-form">
        <h2>Send Message</h2>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea rows="4" placeholder="Your Message"></textarea>
        <button>Send Message</button>
    </div>

    <!-- INFO -->
    <div class="contact-info">
        <h2>Get in Touch</h2>
        <p>📍 Aurangabad, India</p>
        <p>📞 +91 98765 43210</p>
        <p>📧 travelgo@gmail.com</p>
    </div>

</section>

<!-- FOOTER -->
<footer class="footer">
    <p>© 2026 TravelGo | Designed with ❤️</p>
</footer>

</body>
</html>
